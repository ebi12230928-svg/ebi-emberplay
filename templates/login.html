{% extends "base.html" %}
{% block title %}ログイン ・ EMBERPLAY{% endblock %}

{% block content %}
<div class="auth-page-bg">
  <span class="auth-sparkle" style="top: 8%; left: 10%; animation-delay: 0s;">✨</span>
  <span class="auth-sparkle" style="top: 18%; right: 12%; animation-delay: 1.2s;">🌟</span>
  <span class="auth-sparkle" style="bottom: 15%; left: 15%; animation-delay: 2.1s;">💫</span>
  <span class="auth-sparkle" style="bottom: 10%; right: 8%; animation-delay: 0.6s;">✨</span>

  <div class="panel auth-card">
    <svg viewBox="0 0 120 140" class="auth-mascot" aria-hidden="true">
      <defs>
        <linearGradient id="loginFlameGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd166"/>
          <stop offset="100%" stop-color="#e8590c"/>
        </linearGradient>
      </defs>
      <path d="M60 8 C92 40 102 72 90 98 C81 122 39 122 30 98 C18 72 28 40 60 8 Z" fill="url(#loginFlameGrad)"/>
      <circle cx="45" cy="86" r="5.5" fill="#2b1a12"/>
      <circle cx="75" cy="86" r="5.5" fill="#2b1a12"/>
      <circle cx="40" cy="98" r="7" fill="#ff8fa3" opacity="0.55"/>
      <circle cx="80" cy="98" r="7" fill="#ff8fa3" opacity="0.55"/>
      <path d="M48 101 Q60 111 72 101" stroke="#2b1a12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="eyebrow" style="display:block; text-align:center;">おかえりなさい</span>
    <h2 style="text-align:center;">ログイン</h2>

    <button type="button" id="passkey-login-btn" class="btn btn-ghost btn-block" style="margin-bottom: 12px; display:none;">🔐 パスキーでログイン(指紋・顔認証)</button>
    <p id="passkey-login-error" class="text-loss" style="font-size: 12px; text-align:center; display:none;"></p>

    <form method="POST">
      <input type="hidden" id="is_pwa" name="is_pwa" value="0">
      <div class="field">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-ember btn-block">ログイン</button>
    </form>
    <p style="margin-top: 16px; font-size: 13px; text-align:center;">
      アカウントをお持ちでない方は <a href="{{ url_for('auth.register') }}" style="color: var(--gold);">新規登録</a>
    </p>
  </div>
</div>
<script>
  // ホーム画面に追加した「アプリ」として開いている場合は、ログイン状態を長く保持する
  // (毎回ログインし直す手間を減らすため)
  (function () {
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (isStandalone) {
      document.getElementById("is_pwa").value = "1";
    }
  })();

  // パスキー(指紋・顔認証)でのログイン
  (function () {
    const btn = document.getElementById("passkey-login-btn");
    const errorEl = document.getElementById("passkey-login-error");

    // この端末・ブラウザがパスキーに対応しているかを確認してから、ボタンを表示する
    if (window.PublicKeyCredential) {
      btn.style.display = "block";
    }

    function base64urlToBuffer(base64url) {
      const padding = "=".repeat((4 - (base64url.length % 4)) % 4);
      const base64 = (base64url + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = window.atob(base64);
      const buffer = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) buffer[i] = raw.charCodeAt(i);
      return buffer.buffer;
    }
    function bufferToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let str = "";
      for (const b of bytes) str += String.fromCharCode(b);
      return window.btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    btn.addEventListener("click", async () => {
      errorEl.style.display = "none";
      try {
        const optionsRes = await fetch("{{ url_for('webauthn.login_options') }}", { method: "POST" });
        if (!optionsRes.ok) throw new Error("パスキーの確認に失敗しました。");
        const options = await optionsRes.json();

        options.challenge = base64urlToBuffer(options.challenge);
        if (options.allowCredentials) {
          options.allowCredentials = options.allowCredentials.map((c) => ({ ...c, id: base64urlToBuffer(c.id) }));
        }

        const assertion = await navigator.credentials.get({ publicKey: options });

        const payload = {
          id: assertion.id,
          rawId: bufferToBase64url(assertion.rawId),
          type: assertion.type,
          response: {
            clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
            authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
            signature: bufferToBase64url(assertion.response.signature),
            userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
          },
        };

        const verifyRes = await fetch("{{ url_for('webauthn.login_verify') }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const result = await verifyRes.json();
        if (result.ok) {
          window.location.href = result.redirect || "/";
        } else {
          errorEl.textContent = result.error || "パスキーでのログインに失敗しました。";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "パスキーでのログインをキャンセルしました。";
        errorEl.style.display = "block";
      }
    });
  })();
</script>
{% endblock %}
